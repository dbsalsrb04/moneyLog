name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    permissions:
      pages: write
    steps:
      - name: Ensure Pages publishes the built workflow artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          pages_build_type=$(gh api "repos/$GH_REPO/pages" --jq .build_type)
          if [ "$pages_build_type" != "workflow" ]; then
            if ! gh api --method PUT "repos/$GH_REPO/pages" -f build_type=workflow --silent; then
              echo "::error::Open Settings > Pages and set Source to GitHub Actions, then rerun this workflow. Branch publishing serves the unbuilt index.html and causes /src/main.tsx 404."
              exit 1
            fi
          fi

  build:
    needs: configure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the published page and assets
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import os, re, time
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen

          site = os.environ['PAGES_URL']
          for attempt in range(12):
              try:
                  request = Request(site, headers={'Cache-Control': 'no-cache'})
                  with urlopen(request, timeout=20) as response:
                      html = response.read().decode('utf-8')
                  scripts = re.findall(r'<script[^>]+src="([^"]+)"', html)
                  if not scripts or '/src/main.tsx' in html or any(not src.endswith('.js') for src in scripts):
                      raise RuntimeError('The site is still serving source HTML instead of the Vite build')
                  for asset in [*scripts, 'favicon.svg']:
                      with urlopen(urljoin(site, asset), timeout=20) as response:
                          if response.status != 200:
                              raise RuntimeError(f'Asset did not return 200: {asset}')
                  print('Published HTML, JavaScript and favicon verified successfully.')
                  break
              except Exception as error:
                  if attempt == 11:
                      raise
                  print(f'Waiting for Pages: {error}')
                  time.sleep(5)
          PY
